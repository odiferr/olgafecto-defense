<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OlgaFecto · Live Interception Simulator (API)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg-0: #03070f;
  --bg-1: #0a1424;
  --ink: #d7e7f5;
  --ink-dim: #7a8a98;
  --accent: #7cf3ff;
  --accent-warm: #ffb84a;
  --threat: #ff5c46;
  --inter: #7cf3ff;
  --line: rgba(124, 243, 255, 0.22);
  --panel: rgba(8, 14, 22, 0.72);
  --panel-line: rgba(124, 243, 255, 0.18);
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
  --font-display: "Space Grotesk", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body { background: #000; color: var(--ink); font-family: var(--font-display); overflow: hidden; -webkit-font-smoothing: antialiased; }
.app { position: relative; width: 100vw; height: 100vh; min-height: 720px; overflow: hidden; }

.sky-bg {
  position: absolute; inset: 0;
  background:
    linear-gradient(90deg, rgba(0,0,0,0.42) 0%, transparent 16%, transparent 84%, rgba(0,0,0,0.42) 100%),
    radial-gradient(ellipse 60% 40% at 78% 12%, rgba(255,200,120,0.18), transparent 60%),
    linear-gradient(180deg, #02050d 0%, #050d1f 18%, #0a1a36 32%, #15355f 48%,
      #2a5b8e 62%, #5a89b2 76%, #8eb0cd 88%, #b9cfdf 100%);
}
.world {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--font-mono); }
.hud > * { pointer-events: auto; }

.hud-top {
  position: absolute; top: 18px; left: 18px; right: 18px;
  display: flex; justify-content: space-between; align-items: center; pointer-events: none;
}
.hud-brand {
  display: flex; align-items: center; gap: 14px;
  background: var(--panel); border: 1px solid var(--panel-line);
  padding: 10px 16px; backdrop-filter: blur(8px);
}
.logo-mark { color: var(--accent); font-size: 24px; text-shadow: 0 0 12px var(--accent); font-family: var(--font-mono); }
.brand-name { font-family: var(--font-display); font-weight: 700; letter-spacing: 4px; font-size: 18px; color: var(--ink); }
.brand-sub { font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); letter-spacing: 2px; text-transform: uppercase; }

.hud-status {
  display: flex; align-items: center; gap: 10px;
  background: var(--panel); border: 1px solid var(--panel-line);
  padding: 10px 16px; backdrop-filter: blur(8px);
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 1.5px;
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
.muted { color: var(--ink-dim); }

.hud-panel {
  position: absolute; width: 220px;
  background: var(--panel); border: 1px solid var(--panel-line);
  padding: 14px 16px; backdrop-filter: blur(8px);
}
.left-panel { top: 90px; left: 20px; }
.right-panel { top: 90px; right: 20px; }
.stress-panel { bottom: 130px; right: 20px; width: 240px; max-height: calc(100vh - 300px); overflow-y: auto; }
.panel-title {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 3px;
  color: var(--accent); margin-bottom: 10px;
  border-bottom: 1px solid var(--panel-line); padding-bottom: 6px;
  display: flex; justify-content: space-between; align-items: center;
}
.panel-close {
  background: none; border: none; color: var(--accent); font-family: var(--font-mono);
  font-size: 14px; line-height: 1; cursor: pointer; padding: 0 2px; opacity: 0.6;
  transition: opacity 0.1s;
}
.panel-close:hover { opacity: 1; }

/* ── Collapsed panel tabs ── */
.panel-tab {
  position: absolute;
  background: var(--panel); border: 1px solid var(--panel-line);
  backdrop-filter: blur(8px); cursor: pointer;
  writing-mode: vertical-rl; display: flex; align-items: center; justify-content: center;
  padding: 14px 8px; width: 28px;
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 2px; color: var(--accent);
  transition: background 0.12s, border-color 0.12s;
}
.panel-tab:hover { background: rgba(20,35,55,0.9); border-color: var(--accent); }
.left-tab  { top: 90px; left: 20px; transform: rotate(180deg); }
.right-tab { top: 90px; right: 20px; }
.stat { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; font-family: var(--font-mono); }
.stat-label { font-size: 11px; letter-spacing: 2px; color: var(--ink-dim); }
.stat-value { font-size: 15px; color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

/* ── BOTTOM BAR ─────────────────────────────────────────────────────────── */
.hud-bottom {
  position: absolute; bottom: 0; left: 0; right: 0;
  display: flex; align-items: stretch; gap: 0;
  background: linear-gradient(to top, rgba(2,5,15,0.94) 0%, rgba(2,5,15,0.80) 62%, rgba(2,5,15,0.18) 100%);
  border-top: 1px solid var(--panel-line);
  padding: 8px 18px 10px;
  backdrop-filter: blur(10px);
}

.bottom-section-label {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 3.5px;
  color: var(--accent); opacity: 0.7; margin-bottom: 10px;
}

/* ── SCENARIO GRID ──────────────────────────────────────────────────────── */
.bottom-scenarios { flex: 1; padding-right: 20px; border-right: 1px solid var(--panel-line); }
.scenarios-grid { display: flex; gap: 8px; align-items: flex-start; }
.scenario-cat { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.cat-label {
  font-family: var(--font-mono); font-size: 8px; letter-spacing: 3px;
  padding-bottom: 5px; border-bottom: 1px solid;
  margin-bottom: 3px; opacity: 0.85;
}

.scen-btn {
  background: rgba(12, 20, 32, 0.7); border: 1px solid rgba(124,243,255,0.1);
  color: var(--ink); padding: 5px 8px; cursor: pointer; text-align: left;
  font-family: var(--font-mono); width: 100%; transition: all 0.12s ease;
}
.scen-btn:hover:not(:disabled) {
  background: rgba(20,35,55,0.9); border-color: rgba(124,243,255,0.3);
  box-shadow: 0 0 10px rgba(124,243,255,0.12);
}
.scen-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.scen-btn.scen-active { }
.scen-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.scen-name { font-size: 11px; letter-spacing: 1px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.scen-vec { font-size: 9px; letter-spacing: 0.5px; opacity: 0.9; white-space: nowrap; }
.scen-desc { font-size: 8.5px; color: var(--ink-dim); letter-spacing: 0.3px; margin-top: 2px; }

/* ── FIRE CONTROL ───────────────────────────────────────────────────────── */
.bottom-control {
  width: 190px; padding-left: 20px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.fire-status { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.fire-status-row { display: flex; justify-content: space-between; align-items: baseline; }
.fire-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 2px; color: var(--ink-dim); }
.fire-value { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--ink); letter-spacing: 1px; font-variant-numeric: tabular-nums; }
.standby-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 9px 0;
  background: rgba(20, 50, 80, 0.7); border: 1px solid var(--accent);
  color: var(--accent); font-family: var(--font-mono); font-size: 12px;
  letter-spacing: 2.5px; font-weight: 600; cursor: pointer;
  transition: all 0.15s ease;
}
.standby-btn:hover { background: rgba(40,80,120,0.85); box-shadow: 0 0 18px rgba(124,243,255,0.3); }
.standby-btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
.standby-icon { font-size: 10px; }
.stress-main { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; }
.stress-count { font-family: var(--font-mono); font-size: 36px; font-weight: 800; color: var(--ink); line-height: 1; }
.stress-badge { border: 1px solid rgba(124,243,255,0.35); color: var(--accent); padding: 3px 7px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
.stress-badge.struggle { border-color: rgba(255,184,74,0.55); color: var(--accent-warm); }
.stress-badge.fail { border-color: rgba(255,92,70,0.65); color: var(--threat); }
.stress-sub { color: var(--ink-dim); font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px; margin-top: 6px; text-transform: uppercase; }
.stress-bars { margin-top: 12px; display: grid; gap: 5px; }
.stress-row { display: grid; grid-template-columns: 28px 1fr 38px; align-items: center; gap: 8px; color: var(--ink-dim); font-family: var(--font-mono); font-size: 10px; }
.stress-track { height: 5px; background: rgba(140,170,205,0.18); overflow: hidden; }
.stress-track i { display: block; height: 100%; background: linear-gradient(90deg, var(--threat), var(--accent-warm), var(--accent)); }

.outcome-hud {
  margin-top: 12px; padding-top: 10px;
  border-top: 1px solid var(--panel-line);
  text-align: center;
  animation: outcomeIn 0.4s ease-out;
}
.outcome-hud-big {
  font-family: var(--font-mono); font-size: 15px; letter-spacing: 4px; font-weight: 700;
}
.outcome-hud.intercept .outcome-hud-big { color: var(--accent); text-shadow: 0 0 10px var(--accent); }
.outcome-hud.leaker    .outcome-hud-big { color: var(--threat); text-shadow: 0 0 10px var(--threat); }
.outcome-hud.partial   .outcome-hud-big { color: var(--accent-warm); text-shadow: 0 0 10px var(--accent-warm); }
.outcome-hud-sub { font-size: 9px; letter-spacing: 1.5px; color: var(--ink-dim); text-transform: uppercase; margin-top: 4px; }

/* ── Threat table ── */
.threat-row { border-bottom: 1px solid rgba(124,243,255,0.08); padding: 5px 0; }
.threat-row:last-child { border-bottom: none; }
.threat-row-top { display: flex; align-items: baseline; gap: 6px; margin-bottom: 2px; }
.threat-id   { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--threat); letter-spacing: 1px; }
.threat-type { font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); flex: 1; }
.threat-status     { font-family: var(--font-mono); font-size: 9px; letter-spacing: 1.5px; padding: 1px 5px; border: 1px solid; }
.threat-status.eng { color: var(--accent); border-color: var(--accent); }
.threat-status.trk { color: var(--accent-warm); border-color: var(--accent-warm); }
.threat-row-stats  { display: flex; gap: 8px; font-family: var(--font-mono); font-size: 9px; color: var(--ink-dim); letter-spacing: 0.5px; }
@keyframes outcomeIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.92); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

.api-warning {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(20, 8, 8, 0.94); border: 1px solid var(--threat);
  padding: 22px 28px; backdrop-filter: blur(8px);
  font-family: var(--font-mono); font-size: 13px; color: var(--ink);
  max-width: 480px; line-height: 1.6;
  box-shadow: 0 0 40px rgba(255, 92, 70, 0.25);
}
.api-warning strong { color: var(--threat); display: block; margin-bottom: 8px; letter-spacing: 1.2px; }
.api-warning pre { margin: 8px 0 0; padding: 10px 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(124,243,255,0.2); color: var(--accent); font-size: 12px; overflow-x: auto; }

.scanlines {
  position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px,
    rgba(124, 243, 255, 0.015) 2px, rgba(124, 243, 255, 0.015) 3px);
  mix-blend-mode: screen;
}
.app::before, .app::after {
  content: ""; position: absolute; width: 24px; height: 24px;
  border: 2px solid var(--accent); opacity: 0.35; pointer-events: none;
}
.app::before { top: 6px; left: 6px; border-right: none; border-bottom: none; }
.app::after { bottom: 6px; right: 6px; border-left: none; border-top: none; }

@media (max-width: 1280px) {
  .hud-panel { width: 200px; }
  .scen-desc { display: none; }
}

@media (max-height: 820px) {
  .hud-bottom { padding-top: 9px; padding-bottom: 10px; }
  .bottom-section-label { margin-bottom: 6px; }
  .scen-btn { padding: 5px 8px; }
  .scen-desc { display: none; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="web_gui_sim_api.jsx"></script>
</body>
</html>
